<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Arial, Helvetica, sans-serif" font-size="11">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <style>
    .b{fill:#eef3f8;stroke:#1f3b5a;stroke-width:1.2}
    .e{fill:#dbe8f5;stroke:#1f3b5a;stroke-width:1.2}
    .d{fill:#e3f1e4;stroke:#2d6a35;stroke-width:1.2}
    .o{fill:#fff4dc;stroke:#a26b00;stroke-width:1.2}
    .t{text-anchor:middle}
    .s{font-size:9.5px;fill:#444}
    .l{stroke:#333;stroke-width:1.2;fill:none;marker-end:url(#a)}
    .k{stroke:#888;stroke-width:1.1;fill:none;stroke-dasharray:4 3;marker-end:url(#a)}
  </style>
  <!-- data path -->
  <rect class="b" x="5" y="20" width="110" height="46" rx="5"/>
  <text class="t" x="60" y="39">ISIC 2018 image</text><text class="t s" x="60" y="54">RGB, any size</text>
  <rect class="b" x="5" y="86" width="110" height="58" rx="5"/>
  <text class="t" x="60" y="104">Pre-processing</text><text class="t s" x="60" y="118">resize 256×256</text><text class="t s" x="60" y="131">normalise (official)</text>
  <rect class="b" x="5" y="164" width="110" height="58" rx="5"/>
  <text class="t" x="60" y="182">Augmentation</text><text class="t s" x="60" y="196">h/v flip, rotation</text><text class="t s" x="60" y="209">(training only)</text>
  <path class="l" d="M60,66 V84"/><path class="l" d="M60,144 V162"/>
  <path class="l" d="M115,193 H140 V70 H150"/>
  <!-- encoder -->
  <rect class="e" x="150" y="20" width="108" height="42" rx="5"/>
  <text class="t" x="204" y="37">Patch embed 4×4</text><text class="t s" x="204" y="51">64×64×96</text>
  <rect class="e" x="150" y="76" width="108" height="36" rx="5"/><text class="t" x="204" y="92">VSS ×2</text><text class="t s" x="204" y="105">64×64×96</text>
  <rect class="e" x="150" y="126" width="108" height="36" rx="5"/><text class="t" x="204" y="142">merge + VSS ×2</text><text class="t s" x="204" y="155">32×32×192</text>
  <rect class="e" x="150" y="176" width="108" height="36" rx="5"/><text class="t" x="204" y="192">merge + VSS ×2</text><text class="t s" x="204" y="205">16×16×384</text>
  <rect class="e" x="150" y="226" width="108" height="36" rx="5"/><text class="t" x="204" y="242">merge + VSS ×2</text><text class="t s" x="204" y="255">8×8×768</text>
  <path class="l" d="M204,62 V74"/><path class="l" d="M204,112 V124"/><path class="l" d="M204,162 V174"/><path class="l" d="M204,212 V224"/>
  <text class="t" x="204" y="282" font-weight="bold" fill="#1f3b5a">Encoder (VMamba-S init.)</text>
  <!-- decoder -->
  <rect class="d" x="330" y="226" width="108" height="36" rx="5"/><text class="t" x="384" y="242">VSS ×2</text><text class="t s" x="384" y="255">8×8×768</text>
  <rect class="d" x="330" y="176" width="108" height="36" rx="5"/><text class="t" x="384" y="192">expand + VSS ×2</text><text class="t s" x="384" y="205">16×16×384</text>
  <rect class="d" x="330" y="126" width="108" height="36" rx="5"/><text class="t" x="384" y="142">expand + VSS ×2</text><text class="t s" x="384" y="155">32×32×192</text>
  <rect class="d" x="330" y="76" width="108" height="36" rx="5"/><text class="t" x="384" y="92">expand + VSS ×1</text><text class="t s" x="384" y="105">64×64×96</text>
  <rect class="d" x="330" y="20" width="108" height="42" rx="5"/><text class="t" x="384" y="37">expand ×4, 1×1 conv</text><text class="t s" x="384" y="51">256×256×1, sigmoid</text>
  <path class="l" d="M258,236 H328"/>
  <path class="l" d="M384,226 V214"/><path class="l" d="M384,176 V164"/><path class="l" d="M384,126 V114"/><path class="l" d="M384,76 V64"/>
  <path class="k" d="M258,254 H328"/><path class="k" d="M258,194 H328"/><path class="k" d="M258,144 H328"/>
  <text class="t s" x="293" y="138">skip (+)</text>
  <text class="t" x="384" y="282" font-weight="bold" fill="#2d6a35">Decoder</text>
  <!-- outputs -->
  <rect class="o" x="500" y="16" width="120" height="50" rx="5"/>
  <text class="t" x="560" y="34">Lesion probability</text><text class="t s" x="560" y="48">threshold 0.5 → mask</text><text class="t s" x="560" y="60">Dice, IoU, HD95 ...</text>
  <path class="l" d="M438,41 H498"/>
  <rect class="o" x="500" y="86" width="120" height="50" rx="5"/>
  <text class="t" x="560" y="104">BceDice loss</text><text class="t s" x="560" y="118">BCE + (1 − Dice)</text><text class="t s" x="560" y="130">AdamW, cosine LR</text>
  <path class="l" d="M560,66 V84"/>
  <!-- VSS detail -->
  <rect x="490" y="156" width="265" height="136" rx="6" fill="#fafafa" stroke="#999"/>
  <text x="500" y="177" font-weight="bold">VSS block (SS2D)</text>
  <text x="500" y="195" class="s">LayerNorm → Linear → DWConv 3×3 → SiLU</text>
  <text x="500" y="211" class="s">→ flatten in 4 directions (row, column, both reversed)</text>
  <text x="500" y="227" class="s">→ selective scan S6 on each sequence:</text>
  <text x="510" y="243" class="s">h_t = exp(Δ_t A)·h_(t−1) + Δ_t·B_t·x_t</text><text x="640" y="243" class="s"></text>
  <text x="510" y="255" class="s">y_t = C_t·h_t + D·x_t</text><text x="500" y="268" class="s">→ merge 4 outputs → LayerNorm → × SiLU(gate) → Linear</text>
  <text x="500" y="283" class="s" fill="#a26b00">Scan: CUDA kernel (paper) → our Numba CPU kernel</text>
</svg>
